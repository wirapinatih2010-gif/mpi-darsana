        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.bgOsc = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, duration = 0.15, type = 'sine') {
                if (this.isMuted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playCorrect() {
                this.playTone(523.25, 0.1, 'triangle'); // C5
                setTimeout(() => this.playTone(659.25, 0.1, 'triangle'), 100); // E5
                setTimeout(() => this.playTone(783.99, 0.2, 'triangle'), 200); // G5
            }

            playWrong() {
                this.playTone(220, 0.15, 'sawtooth');
                setTimeout(() => this.playTone(196, 0.25, 'sawtooth'), 150);
            }

            playClick() {
                this.playTone(800, 0.04, 'sine');
            }
        }

                                        {/* Pengertian Column */}

                                            <h4 className="text-xs font-bold uppercase text-zinc-400">Pilih Pengertian:</h4>
                                            {[...MATCH_ITEMS].sort(() => 0.5 - Math.random()).map((item) => {
                                                const isMatched = matchedPairs[item.id];
                                                return (
                                                    <button
                                                        key={item.id}
                                                        disabled={isMatched}
                                                        onClick={() => handleDefClick(item)}
                                                        className={`w-full text-left p-3.5 rounded-xl border text-xs md:text-sm transition-all ${
                                                            isMatched
                                                                ? 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/40 dark:text-emerald-300 opacity-60'
                                                                : 'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 hover:border-gold-500'
                                                        }`}
                                                    >
                                                        {item.def}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                {/* GAME 2: Benar atau Salah Fast Quiz */}
                                <div className="glass-card p-6 rounded-3xl border border-gold-500/20 shadow-md space-y-4">
                                    <div className="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-3">
                                        <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                                            ⚡ Mini Game 2: Tantangan Benar atau Salah
                                        </h3>
                                        <span className="text-xs font-semibold text-zinc-500">Soal {tfIndex + 1} / {TRUE_FALSE_ITEMS.length}</span>
                                    </div>

                                    {!tfFinished ? (
                                        <div className="space-y-6 py-4 text-center">
                                            <p className="text-lg md:text-xl font-medium text-brown-800 dark:text-gold-300">
                                                "{TRUE_FALSE_ITEMS[tfIndex].text}"
                                            </p>

                                            <div className="flex justify-center gap-4 max-w-xs mx-auto">
                                                <button
                                                    onClick={() => handleTFAnswer(true)}
                                                    className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-md transition-transform active:scale-95"
                                                >
                                                    BENAR (BENAR)
                                                </button>
                                                <button
                                                    onClick={() => handleTFAnswer(false)}
                                                    className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl shadow-md transition-transform active:scale-95"
                                                >
                                                    SALAH
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-6 space-y-3">
                                            <div className="text-3xl">🎉</div>
                                            <h4 className="font-bold text-lg">Tantangan Selesai!</h4>
                                            <p className="text-sm text-zinc-600 dark:text-zinc-400">
                                                Skor Kamu: <span className="font-bold text-gold-600">{tfScore}</span> dari {TRUE_FALSE_ITEMS.length} benar!
                                            </p>
                                            <button
                                                onClick={() => { setTfIndex(0); setTfScore(0); setTfFinished(false); }}
                                                className="px-4 py-2 bg-gold-500 text-zinc-950 font-semibold text-xs rounded-xl shadow"
                                            >
                                                Main Lagi
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ================= VIDEO PEMBELAJARAN ================= */}
                        {currentTab === 'video' && (
                            <div className="space-y-6">
                                <div className="text-center max-w-2xl mx-auto space-y-2">
                                    <h2 className="font-cinzel text-2xl md:text-3xl font-bold text-brown-800 dark:text-gold-300">
                                        Video Pembelajaran Interaktif
                                    </h2>
                                    <p className="text-sm text-zinc-600 dark:text-zinc-400">
                                        Saksikan konten multimedia visual untuk memperdalam wawasan ajaran Dharma dan budaya Bali.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {VIDEO_LIST.map((vid) => (
                                        <div key={vid.id} className="glass-card rounded-2xl border border-gold-500/10 overflow-hidden shadow-md flex flex-col justify-between">
                                            {/* Video Thumbnail Placeholder */}
                                            <div className="relative h-48 bg-gradient-to-br from-brown-800 to-amber-950 flex items-center justify-center text-white group cursor-pointer">
                                                <div className="w-14 h-14 rounded-full bg-gold-500/90 text-zinc-950 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                                    <i data-lucide="play" className="w-6 h-6 fill-current ml-1"></i>
                                                </div>
                                                <span className="absolute bottom-3 right-3 bg-black/70 px-2 py-0.5 rounded text-[11px] font-mono">
                                                    {vid.duration}
                                                </span>
                                                <span className="absolute top-3 left-3 bg-gold-500 text-zinc-950 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">
                                                    {vid.category}
                                                </span>
                                            </div>
                                            <div className="p-5 space-y-2">
                                                <h3 className="font-bold text-base text-brown-800 dark:text-gold-300">
                                                    {vid.title}
                                                </h3>
                                                <p className="text-xs text-zinc-500 dark:text-zinc-400 leading-relaxed">
                                                    {vid.desc}
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ================= MISI & AKTIVITAS ================= */}
                        {currentTab === 'aktivitas' && (
                            <div className="space-y-6">
                                <div className="text-center max-w-2xl mx-auto space-y-2">
                                    <h2 className="font-cinzel text-2xl md:text-3xl font-bold text-brown-800 dark:text-gold-300">
                                        Aktivitas & Misi Penerapan Dharma
                                    </h2>
                                    <p className="text-sm text-zinc-600 dark:text-zinc-400">
                                        Terapkan ajaran nilai kebaikan dalam kehidupan nyata harianmu di lingkungan sekolah dan rumah!
                                    </p>
                                </div>

                                <div className="glass-card p-6 rounded-3xl border border-gold-500/20 shadow-md space-y-4">
                                    <h3 className="font-bold text-base md:text-lg flex items-center gap-2 border-b border-zinc-200 dark:border-zinc-800 pb-3">
                                        <i data-lucide="target" className="w-5 h-5 text-gold-500"></i> Check-List Misi Harian Siswa
                                    </h3>

                                    <div className="space-y-3">
                                        {missions.map((m) => (
                                            <div
                                                key={m.id}
                                                onClick={() => {
                                                    const updated = missions.map(item => item.id === m.id ? { ...item, done: !item.done } : item);
                                                    setMissions(updated);
                                                    if (!m.done) {
                                                        addXP(25);
                                                        sound.playCorrect();
                                                    }
                                                }}
                                                className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-center gap-3 ${
                                                    m.done
                                                        ? 'bg-emerald-50/60 dark:bg-emerald-950/30 border-emerald-500/30 line-through text-zinc-500'
                                                        : 'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 hover:border-gold-500'
                                                }`}
                                            >
                                                <div className={`w-6 h-6 rounded-lg flex items-center justify-center border text-xs font-bold ${
                                                    m.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-zinc-400'
                                                }`}>
                                                    {m.done && '✓'}
                                                </div>
                                                <p className="text-xs md:text-sm font-medium flex-1">
                                                    {m.text}
                                                </p>
                                                <span className="text-[11px] text-amber-600 font-semibold bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded-md">
                                                    +25 XP
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= KUIS INTERAKTIF ================= */}
                        {currentTab === 'kuis' && (
                            <div className="space-y-6">
                                <div className="text-center max-w-2xl mx-auto space-y-2">
                                    <h2 className="font-cinzel text-2xl md:text-3xl font-bold text-brown-800 dark:text-gold-300">
                                        Kuis Interaktif Agama Hindu
                                    </h2>
                                    <p className="text-sm text-zinc-600 dark:text-zinc-400">
                                        Uji pemahaman materi dengan 10 soal pilihan ganda di bawah ini.
                                    </p>
                                </div>

                                {!quizSubmitted ? (
                                    <div className="space-y-6">
                                        {QUIZ_QUESTIONS.map((q, idx) => (
                                            <div key={q.id} className="glass-card p-6 rounded-2xl border border-gold-500/15 shadow-sm space-y-4">
                                                <div className="flex items-start gap-3">
                                                    <span className="w-7 h-7 rounded-lg bg-gold-500/20 text-gold-700 dark:text-gold-400 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">
                                                        {idx + 1}
                                                    </span>
                                                    <p className="font-semibold text-sm md:text-base text-brown-800 dark:text-cream-100">
                                                        {q.question}
                                                    </p>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1 pl-10">
                                                    {q.options.map((opt, optIdx) => {
                                                        const isSelected = quizAnswers[q.id] === optIdx;
                                                        return (
                                                            <button
                                                                key={optIdx}
                                                                onClick={() => {
                                                                    sound.playClick();
                                                                    setQuizAnswers({ ...quizAnswers, [q.id]: optIdx });
                                                                }}
                                                                className={`p-3 rounded-xl text-left text-xs md:text-sm transition-all border ${
                                                                    isSelected
                                                                        ? 'bg-gold-500 text-zinc-950 border-gold-600 font-bold shadow-sm'
                                                                        : 'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 hover:border-gold-400'
                                                                }`}
                                                            >
                                                                <span className="font-mono text-zinc-400 mr-2">{String.fromCharCode(65 + optIdx)}.</span>
                                                                {opt}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}

                                        <div className="text-center pt-4">
                                            <button
                                                onClick={handleQuizSubmit}
                                                disabled={Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length}
                                                className={`px-8 py-3.5 rounded-2xl font-bold text-sm shadow-xl transition-all ${
                                                    Object.keys(quizAnswers).length === QUIZ_QUESTIONS.length
                                                        ? 'bg-gradient-to-r from-gold-500 to-amber-600 text-white hover:scale-105'
                                                        : 'bg-zinc-300 dark:bg-zinc-800 text-zinc-500 cursor-not-allowed'
                                                }`}
                                            >
                                                Kirim & Lihat Hasil Skor Kuis
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    /* RESULT SCORE CARD */
                                    <div className="glass-card p-8 rounded-3xl border border-gold-500/30 text-center space-y-6 max-w-xl mx-auto shadow-xl">
                                        <div className="w-20 h-20 mx-auto rounded-full bg-gold-500/20 text-gold-600 flex items-center justify-center text-4xl">
                                            🏆
                                        </div>

                                        <div className="space-y-2">
                                            <h3 className="text-xs uppercase font-bold text-zinc-400 tracking-widest">Hasil Kuis Kamu</h3>
                                            <div className="text-5xl font-black text-brown-800 dark:text-gold-300">
                                                {quizScore} <span className="text-xl text-zinc-400 font-normal">/ 100</span>
                                            </div>
                                            <div className="pt-2">
                                                <span className={`inline-block px-4 py-1.5 rounded-full text-xs font-bold ${getQuizCategory(quizScore).color}`}>
                                                    Kategori: {getQuizCategory(quizScore).label}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-cream-100/80 dark:bg-zinc-900/80 rounded-2xl text-xs space-y-1 text-zinc-600 dark:text-zinc-400">
                                            <p>Jawaban Benar: <strong className="text-emerald-600">{quizScore / 10}</strong> / 10 Soal</p>
                                            <p>Jawaban Salah: <strong className="text-rose-600">{10 - (quizScore / 10)}</strong> / 10 Soal</p>
                                        </div>

                                        <button
                                            onClick={() => {
                                                setQuizAnswers({});
                                                setQuizSubmitted(false);
                                                sound.playClick();
                                            }}
                                            className="px-6 py-3 bg-gold-500 hover:bg-gold-600 text-zinc-950 font-bold text-sm rounded-xl shadow-md transition-all"
                                        >
                                            Ulangi Kuis
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= EVALUASI ================= */}
                        {currentTab === 'evaluasi' && (
                            <div className="glass-card p-6 md:p-8 rounded-3xl border border-gold-500/20 shadow-md space-y-6 max-w-3xl mx-auto">
                                <div className="border-b border-zinc-200 dark:border-zinc-800 pb-4">
                                    <h2 className="font-cinzel text-2xl font-bold text-brown-800 dark:text-gold-300">
                                        Evaluasi Refleksi Pembelajaran
                                    </h2>
                                    <p className="text-xs text-zinc-500">
                                        Refleksikan pemahaman dirimu setelah mempelajari seluruh bab pada media Darsana.
                                    </p>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold uppercase text-zinc-500">1. Apa pemahaman paling berkesan yang kamu dapatkan tentang ajaran Tri Hita Karana?</label>
                                        <textarea
                                            rows="3"
                                            placeholder="Tuliskan pendapat atau intisari pemikiranmu di sini..."
                                            className="w-full p-3 text-xs md:text-sm rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 focus:outline-none focus:border-gold-500"
                                        ></textarea>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-xs font-bold uppercase text-zinc-500">2. Sebutkan satu tantangan terbesar dalam menjaga Vacika Parisudha (perkataan jujur/santun) di media sosial saat ini!</label>
                                        <textarea
                                            rows="3"
                                            placeholder="Tuliskan analisis opinimu..."
                                            className="w-full p-3 text-xs md:text-sm rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 focus:outline-none focus:border-gold-500"
                                        ></textarea>
                                    </div>

                                    <button
                                        onClick={() => {
                                            sound.playCorrect();
                                            confetti({ particleCount: 60, spread: 50 });
                                            alert("Terima kasih! Jawaban evaluasi refleksi berhasil tersimpan.");
                                        }}
                                        className="w-full py-3 bg-gold-500 hover:bg-gold-600 text-zinc-950 font-bold text-sm rounded-xl shadow-md transition-all"
                                    >
                                        Kirim Evaluasi Diri
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ================= PROFIL APLIKASI ================= */}
                        {currentTab === 'profil' && (
                            <div className="glass-card p-6 md:p-8 rounded-3xl border border-gold-500/20 shadow-lg max-w-2xl mx-auto space-y-6">
                                <div className="text-center space-y-2 border-b border-zinc-200 dark:border-zinc-800 pb-6">
                                    <div className="w-16 h-16 mx-auto rounded-full bg-gold-500/20 text-gold-600 flex items-center justify-center text-3xl">
                                        🪷
                                    </div>
                                    <h2 className="font-cinzel text-2xl font-bold text-brown-800 dark:text-gold-300">
                                        DARSANA
                                    </h2>
                                    <p className="text-xs text-gold-600 dark:text-gold-400 font-semibold tracking-wider">
                                        MEDIA PEMBELAJARAN INTERAKTIF AGAMA HINDU
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                    <div className="p-3.5 bg-cream-100/60 dark:bg-zinc-900/60 rounded-xl border border-zinc-200/60 dark:border-zinc-800 space-y-1">
                                        <span className="text-zinc-400 font-bold uppercase text-[10px]">Mata Pelajaran:</span>
                                        <p className="font-semibold text-sm">Pendidikan Agama Hindu & Budi Pekerti</p>
                                    </div>
                                    <div className="p-3.5 bg-cream-100/60 dark:bg-zinc-900/60 rounded-xl border border-zinc-200/60 dark:border-zinc-800 space-y-1">
                                        <span className="text-zinc-400 font-bold uppercase text-[10px]">Sasaran Pengguna:</span>
                                        <p className="font-semibold text-sm">Siswa SMA / SMK Kelas XI</p>
                                    </div>
                                    <div className="p-3.5 bg-cream-100/60 dark:bg-zinc-900/60 rounded-xl border border-zinc-200/60 dark:border-zinc-800 space-y-1">
                                        <span className="text-zinc-400 font-bold uppercase text-[10px]">Kurikulum:</span>
                                        <p className="font-semibold text-sm">Kurikulum Merdeka (Capaian Pembelajaran Phase F)</p>
                                    </div>
                                    <div className="p-3.5 bg-cream-100/60 dark:bg-zinc-900/60 rounded-xl border border-zinc-200/60 dark:border-zinc-800 space-y-1">
                                        <span className="text-zinc-400 font-bold uppercase text-[10px]">Konsep Desain:</span>
                                        <p className="font-semibold text-sm">Modern Balinese Hindu Aesthetic</p>
                                    </div>
                                </div>

                                <div className="p-4 bg-amber-500/10 rounded-2xl border border-gold-500/20 text-xs space-y-2">
                                    <h4 className="font-bold text-brown-800 dark:text-gold-300">🎯 Tujuan Pembuatan:</h4>
                                    <p className="text-zinc-600 dark:text-zinc-400 leading-relaxed">
                                        Menyediakan media pembelajaran mandiri yang interaktif, menyenangkan, dan relevan bagi generasi muda Hindu dalam mempelajari nilai-nilai kebenaran Dharma di era digital.
                                    </p>
                                </div>

                                <div className="text-center text-xs text-zinc-400 pt-2">
                                    <p>© 2026 Darsana. Om Shanti Shanti Shanti Om.</p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
